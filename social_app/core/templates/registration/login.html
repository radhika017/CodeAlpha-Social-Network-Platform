<!DOCTYPE html>
<html>
<head>
    <title>Login | SocialHub</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(135deg,#1877f2,#6fb1fc);
        }

        .login-container{

            width:400px;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(12px);

            padding:40px;

            border-radius:25px;

            box-shadow:0 8px 32px rgba(0,0,0,0.2);

            border:1px solid rgba(255,255,255,0.2);

            text-align:center;

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            font-size:40px;
            margin-bottom:10px;
        }

        h2{
            color:white;
            margin-bottom:30px;
            font-weight:600;
        }

        form p{
            text-align:left;
            color:white;
            margin-bottom:18px;
        }

        input{
            width:100%;
            padding:14px;

            border:none;
            outline:none;

            border-radius:12px;

            margin-top:8px;

            background:rgba(255,255,255,0.9);

            font-size:15px;
        }

        button{
            width:100%;

            padding:14px;

            border:none;

            border-radius:14px;

            background:white;

            color:#1877f2;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s ease;

            margin-top:10px;
        }

        button:hover{
            transform:translateY(-3px);
            background:#f1f1f1;
        }

        .bottom-text{
            color:white;
            margin-top:20px;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">🚀</div>

    <h2>Welcome Back</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>

    </form>

    <p class="bottom-text">
        SocialHub • Connect with the world
    </p>

</div>

</body>
</html>
