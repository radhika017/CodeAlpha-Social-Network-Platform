<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SocialHub</title>
     <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg, #1877f2, #6fb1fc);
        }

        .login-box{
            width:400px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            box-shadow:0 8px 25px rgba(0,0,0,0.2);
            text-align:center;
            color:white;
        }

        .logo{
            font-size:50px;
            margin-bottom:10px;
        }

        .login-box h2{
            margin-bottom:30px;
            font-size:36px;
        }

        form{
            width:100%;
        }

        input{
            width:100%;
            padding:14px;
            margin:12px 0;
            border:none;
            border-radius:10px;
            outline:none;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:white;
            color:#1877f2;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#e4e6eb;
            transform:scale(1.03);
        }

        p{
            margin-top:20px;
            font-size:15px;
            opacity:0.9;
        }

     </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🚀</div>

        <h2>Welcome Back</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p>SocialHub • Connect with the world</p>

    </div>

</body>
</html>
