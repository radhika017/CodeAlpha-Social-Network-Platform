<!DOCTYPE html>
<html>
<head>
    <title>Mini Social Media App</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
   <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#dfe9f3,#ffffff);
    min-height:100vh;
}

/* NAVBAR */

nav{
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(12px);

    box-shadow:0 8px 25px rgba(0,0,0,0.08);

    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#1877f2;
    letter-spacing:1px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:#222;
    font-weight:500;
    transition:0.3s ease;
    position:relative;
}

nav a::after{
    content:'';
    width:0%;
    height:2px;
    background:#1877f2;
    position:absolute;
    left:0;
    bottom:-5px;
    transition:0.3s;
}

nav a:hover::after{
    width:100%;
}

nav a:hover{
    color:#1877f2;
}

/* CONTAINER */

.container{
    width:65%;
    margin:auto;
    padding-top:40px;
}

/* POST CARD */

.post-box{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(10px);

    padding:28px;
    border-radius:22px;

    margin-bottom:30px;

    box-shadow:
    0 8px 32px rgba(31,38,135,0.12);

    border:1px solid rgba(255,255,255,0.3);

    transition:0.4s ease;
}

.post-box:hover{
    transform:translateY(-5px);
}

/* TEXT */

h2,h3{
    color:#222;
    margin-bottom:14px;
}

p{
    color:#444;
    line-height:1.8;
    font-size:15px;
}

/* INPUTS */

textarea,
input{
    width:100%;
    padding:14px 16px;

    border:none;
    border-radius:14px;

    margin-top:12px;
    margin-bottom:18px;

    background:#f4f7fb;

    font-size:15px;
    outline:none;

    transition:0.3s;
}

textarea:focus,
input:focus{
    box-shadow:0 0 0 3px rgba(24,119,242,0.2);
}

/* BUTTONS */

button{
    background:linear-gradient(135deg,#1877f2,#4f9cff);

    color:white;
    border:none;

    padding:12px 24px;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;
    font-weight:600;

    transition:0.3s ease;

    box-shadow:0 6px 15px rgba(24,119,242,0.25);
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(24,119,242,0.35);
}

/* LIKE BUTTON */

.like-btn{
    background:#eef3ff;
    color:#1877f2;
    box-shadow:none;
}

.like-btn:hover{
    background:#1877f2;
    color:white;
}

/* PROFILE CARD */

.profile-card{
    text-align:center;
    padding:35px;
}

.profile-avatar{
    width:100px;
    height:100px;

    border-radius:50%;

    background:linear-gradient(135deg,#1877f2,#5ea2ff);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:38px;
    font-weight:700;

    margin:auto;
    margin-bottom:18px;

    box-shadow:0 8px 25px rgba(24,119,242,0.3);
}

/* SCROLLBAR */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#1877f2;
    border-radius:20px;
}

/* MOBILE */

@media(max-width:900px){

    .container{
        width:92%;
    }

    nav{
        padding:16px 5%;
    }

    .nav-links{
        gap:14px;
    }

    .logo{
        font-size:22px;
    }
}

</style>
</head>

<body>

<nav>

    <div class="logo">🚀 SocialHub</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/profile/1/">Profile</a>

        <form action="/accounts/logout/" method="POST" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>

</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
